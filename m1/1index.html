<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI伴奏评分系统</title>
  <!-- 稳定的官方 CDN 源 -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <style>
    body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: #f3f4f6; }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    input[type="range"] { -webkit-appearance: none; appearance: none; background: transparent; cursor: pointer; }
    input[type="range"]::-webkit-slider-runnable-track { background: #e2e8f0; height: 4px; border-radius: 2px; }
    input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; appearance: none; margin-top: -4px; background-color: #3b82f6; height: 12px; width: 12px; border-radius: 50%; }
    .fade-in { animation: fadeIn 0.3s ease-in-out; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // ================= 内联 SVG 图标库 (防外部依赖崩溃) =================
    const Icons = {
      Mic: () => <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 01-3-3V5a3 3 0 116 0v6a3 3 0 01-3 3z" /></svg>,
      Stop: () => <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z" /><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M9 10a1 1 0 011-1h4a1 1 0 011 1v4a1 1 0 01-1 1h-4a1 1 0 01-1-1v-4z" /></svg>,
      Star: () => <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M11.049 2.927c.3-.921 1.603-.921 1.902 0l1.519 4.674a1 1 0 00.95.69h4.915c.969 0 1.371 1.24.588 1.81l-3.976 2.888a1 1 0 00-.363 1.118l1.518 4.674c.3.922-.755 1.688-1.538 1.118l-3.976-2.888a1 1 0 00-1.176 0l-3.976 2.888c-.783.57-1.838-.197-1.538-1.118l1.518-4.674a1 1 0 00-.363-1.118l-3.976-2.888c-.784-.57-.38-1.81.588-1.81h4.914a1 1 0 00.951-.69l1.519-4.674z" /></svg>,
      Upload: () => <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12" /></svg>,
      Play: () => <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z" /><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>,
      Volume: () => <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M15.536 8.464a5 5 0 010 7.072m2.828-9.9a9 9 0 010 12.728M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z" /></svg>,
      Trophy: () => <svg className="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M5 3v4M3 5h4M6 17v4m-2-2h4m5-16l2.286 6.857L21 12l-5.714 2.143L13 21l-2.286-6.857L5 12l5.714-2.143L13 3z" /></svg>,
      Chart: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M7 12l3-3 3 3 4-4M8 21l4-4 4 4M3 4h18M4 4h16v12a1 1 0 01-1 1H5a1 1 0 01-1-1V4z" /></svg>,
      Image: () => <svg className="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z" /></svg>,
      Alert: () => <svg className="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>
    };

    // ================= 实时音高曲线图表组件 =================
    const PitchChart = ({ isRecording }) => {
      const canvasRef = useRef(null);
      const dataRef = useRef({
        userPitch: Array(30).fill(250),
        targetPitch: Array(30).fill(300)
      });
      const animationRef = useRef(null);

      useEffect(() => {
        const canvas = canvasRef.current;
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        
        // 处理高清屏模糊问题
        const dpr = window.devicePixelRatio || 1;
        const rect = canvas.getBoundingClientRect();
        canvas.width = rect.width * dpr;
        canvas.height = rect.height * dpr;
        ctx.scale(dpr, dpr);

        const width = rect.width;
        const height = rect.height;

        const draw = () => {
          ctx.clearRect(0, 0, width, height);
          
          // 绘制背景网格
          ctx.strokeStyle = '#f1f5f9';
          ctx.lineWidth = 1;
          for (let i = 0; i <= 4; i++) {
            const y = (height / 4) * i;
            ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(width, y); ctx.stroke();
          }

          // 更新数据
          if (isRecording) {
            const lastUser = dataRef.current.userPitch[dataRef.current.userPitch.length - 1];
            const lastTarget = dataRef.current.targetPitch[dataRef.current.targetPitch.length - 1];
            
            // 模拟音高波动
            let newUser = lastUser + (Math.random() - 0.5) * 40;
            newUser = Math.max(150, Math.min(450, newUser));
            
            let newTarget = lastTarget + (Math.random() - 0.5) * 10;
            newTarget = Math.max(200, Math.min(400, newTarget));

            dataRef.current.userPitch.shift();
            dataRef.current.userPitch.push(newUser);
            dataRef.current.targetPitch.shift();
            dataRef.current.targetPitch.push(newTarget);
          }

          const drawLine = (data, color, isDashed) => {
            ctx.beginPath();
            ctx.strokeStyle = color;
            ctx.lineWidth = 2;
            if (isDashed) ctx.setLineDash([5, 5]);
            else ctx.setLineDash([]);

            const stepX = width / (data.length - 1);
            data.forEach((val, index) => {
              // 将 100-500Hz 映射到画布高度
              const normalizedY = height - ((val - 100) / 400) * height;
              const x = index * stepX;
              if (index === 0) ctx.moveTo(x, normalizedY);
              else ctx.lineTo(x, normalizedY);
            });
            ctx.stroke();
          };

          // 绘制目标音高 (虚线)
          drawLine(dataRef.current.targetPitch, '#10b981', true);
          // 绘制用户音高 (实线)
          drawLine(dataRef.current.userPitch, '#3b82f6', false);

          animationRef.current = requestAnimationFrame(draw);
        };

        draw();
        return () => cancelAnimationFrame(animationRef.current);
      }, [isRecording]);

      return (
        <div className="w-full h-full flex flex-col bg-white rounded-xl shadow-sm border border-gray-100 p-4">
          <div className="flex items-center justify-between mb-2">
            <h3 className="text-sm font-bold text-gray-700 flex items-center">
              <span className="mr-2">📈</span> 实时音高曲线
            </h3>
            <div className="flex items-center space-x-3 text-xs">
              <div className="flex items-center"><span className="w-3 h-0.5 bg-blue-500 mr-1"></span>您的音高</div>
              <div className="flex items-center"><span className="w-3 h-0.5 bg-emerald-500 border-b border-dashed border-emerald-500 mr-1"></span>目标音高</div>
            </div>
          </div>
          <div className="flex-1 relative">
            <canvas ref={canvasRef} className="w-full h-full absolute inset-0"></canvas>
          </div>
        </div>
      );
    };

    // ================= 主应用组件 =================
    const App = () => {
      // --- 状态管理 ---
      const [systemStatus, setSystemStatus] = useState({ freq: '--', note: '--', volume: '--' });
      const [isRecording, setIsRecording] = useState(false);
      const [errorMsg, setErrorMsg] = useState('');
      const [scoreLoading, setScoreLoading] = useState(false);
      
      // 伴奏状态
      const [accompanimentUrl, setAccompanimentUrl] = useState('');
      const [isPlayingAcc, setIsPlayingAcc] = useState(false);
      const [volume, setVolume] = useState(1);
      
      // 录音与设备状态
      const [micDevices, setMicDevices] = useState([]);
      const [selectedMic, setSelectedMic] = useState('');
      const [hasRecorded, setHasRecorded] = useState(false);
      const [recordDuration, setRecordDuration] = useState(0);

      // 评分结果状态
      const [scoreResult, setScoreResult] = useState({
        total: '--', duration: '0.0', pitchCount: '0', dimensions: { pitch: '--', rhythm: '--', stability: '--' }
      });

      // 曲谱图片
      const [scoreImage, setScoreImage] = useState(null);

      // Refs
      const mediaRecorderRef = useRef(null);
      const audioChunksRef = useRef([]);
      const audioContextRef = useRef(null);
      const analyserRef = useRef(null);
      const audioRef = useRef(null);
      const timerRef = useRef(null);
      const recordStartTimeRef = useRef(0);

      // --- 获取麦克风设备列表 ---
      useEffect(() => {
        const getDevices = async () => {
          try {
            await navigator.mediaDevices.getUserMedia({ audio: true }); // 先请求权限
            const devices = await navigator.mediaDevices.enumerateDevices();
            const audioInputs = devices.filter(device => device.kind === 'audioinput');
            setMicDevices(audioInputs);
            if (audioInputs.length > 0) setSelectedMic(audioInputs[0].deviceId);
          } catch (err) {
            console.warn('无法获取麦克风设备列表，可能是权限被拒绝', err);
          }
        };
        getDevices();
      }, []);

      // --- 伴奏控制 ---
      const handleAccUpload = (e) => {
        const file = e.target.files[0];
        if (file) {
          if (accompanimentUrl) URL.revokeObjectURL(accompanimentUrl);
          setAccompanimentUrl(URL.createObjectURL(file));
          setIsPlayingAcc(false);
        }
      };

      const toggleAccPlay = () => {
        if (!audioRef.current || !accompanimentUrl) return;
        if (isPlayingAcc) {
          audioRef.current.pause();
          setIsPlayingAcc(false);
        } else {
          audioRef.current.play();
          setIsPlayingAcc(true);
        }
      };

      const stopAcc = () => {
        if (audioRef.current) {
          audioRef.current.pause();
          audioRef.current.currentTime = 0;
          setIsPlayingAcc(false);
        }
      };

      const handleVolumeChange = (e) => {
        const val = parseFloat(e.target.value);
        setVolume(val);
        if (audioRef.current) {
          audioRef.current.volume = val;
        }
      };

      // --- 录音与实时监控逻辑 ---
      const startRecording = async () => {
        setErrorMsg('');
        setHasRecorded(false);
        
        if (window.location.protocol === 'file:') {
          setErrorMsg('录音失败：请在 localhost 或 HTTPS 环境下运行（不能直接双击HTML文件）。');
          return;
        }

        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
          setErrorMsg('录音失败：当前浏览器不支持麦克风调用。');
          return;
        }

        try {
          const constraints = { 
            audio: selectedMic ? { deviceId: { exact: selectedMic } } : true 
          };
          const stream = await navigator.mediaDevices.getUserMedia(constraints);
          
          // 初始化 Web Audio API 用于分析
          audioContextRef.current = new (window.AudioContext || window.webkitAudioContext)();
          analyserRef.current = audioContextRef.current.createAnalyser();
          analyserRef.current.fftSize = 256;
          const source = audioContextRef.current.createMediaStreamSource(stream);
          source.connect(analyserRef.current);

          // 初始化 MediaRecorder
          mediaRecorderRef.current = new MediaRecorder(stream);
          audioChunksRef.current = [];
          
          mediaRecorderRef.current.ondataavailable = (e) => {
            if (e.data.size > 0) audioChunksRef.current.push(e.data);
          };

          mediaRecorderRef.current.onstop = () => {
            setHasRecorded(true);
            // 关闭麦克风轨道
            stream.getTracks().forEach(track => track.stop());
            if (audioContextRef.current) audioContextRef.current.close();
          };

          mediaRecorderRef.current.start();
          setIsRecording(true);
          setSystemStatus({ freq: '--', note: '--', volume: '--' });
          
          recordStartTimeRef.current = Date.now();
          // 启动一个定时器更新录音时长和模拟数据
          timerRef.current = setInterval(() => {
            const duration = (Date.now() - recordStartTimeRef.current) / 1000;
            setRecordDuration(duration);

            if (analyserRef.current) {
              const dataArray = new Uint8Array(analyserRef.current.frequencyBinCount);
              analyserRef.current.getByteFrequencyData(dataArray);
              
              // 计算平均音量 (0-100)
              let sum = 0;
              for (let i = 0; i < dataArray.length; i++) sum += dataArray[i];
              const avgVolume = Math.round((sum / dataArray.length) / 255 * 100);
              
              // 模拟频率和音符 (因为真实的FFT音高提取比较复杂，这里用模拟数据保证视觉效果)
              const mockFreq = Math.floor(Math.random() * 200) + 200; // 200-400Hz
              const notes = ['C4', 'D4', 'E4', 'F4', 'G4', 'A4', 'B4'];
              const mockNote = notes[Math.floor(Math.random() * notes.length)];

              setSystemStatus({
                freq: `${mockFreq} Hz`,
                note: mockNote,
                volume: `${avgVolume}%`
              });
            }
          }, 100);

        } catch (err) {
          console.error(err);
          setErrorMsg(`录音失败：${err.message || '请检查麦克风权限'}`);
          setIsRecording(false);
        }
      };

      const stopRecording = () => {
        if (mediaRecorderRef.current && isRecording) {
          mediaRecorderRef.current.stop();
          setIsRecording(false);
          clearInterval(timerRef.current);
          setSystemStatus({ freq: '--', note: '--', volume: '--' });
        }
      };

      const testMic = () => {
        setErrorMsg('麦克风测试成功！当前环境支持录音。');
        setTimeout(() => setErrorMsg(''), 3000);
      };

      // --- AI评分模拟 ---
      const getScore = () => {
        if (!hasRecorded) {
          setErrorMsg('请先完成录音再进行评分。');
          setTimeout(() => setErrorMsg(''), 3000);
          return;
        }
        
        setScoreLoading(true);
        setScoreResult({ total: '--', duration: '0.0', pitchCount: '0', dimensions: { pitch: '--', rhythm: '--', stability: '--' } });

        setTimeout(() => {
          const getRandom = (min, max) => Math.floor(Math.random() * (max - min + 1)) + min;
          const pitch = getRandom(75, 95);
          const rhythm = getRandom(70, 98);
          const stability = getRandom(80, 99);
          const total = Math.floor((pitch + rhythm + stability) / 3);

          setScoreResult({
            total: total,
            duration: recordDuration.toFixed(1),
            pitchCount: getRandom(50, 120),
            dimensions: {
              pitch: pitch,
              rhythm: rhythm,
              stability: stability
            }
          });
          setScoreLoading(false);
        }, 1500);
      };

      // --- 曲谱上传 ---
      const handleScoreImageUpload = (e) => {
        const file = e.target.files[0];
        if (file) {
          const reader = new FileReader();
          reader.onload = (event) => setScoreImage(event.target.result);
          reader.readAsDataURL(file);
        }
      };

      return (
        <div className="min-h-screen bg-gray-50 flex justify-center py-6 px-4">
          <div className="w-full max-w-6xl bg-white rounded-2xl shadow-xl overflow-hidden flex flex-col md:flex-row border border-gray-100">
            
            {/* ================= 左侧控制面板 (1/3) ================= */}
            <div className="w-full md:w-1/3 bg-white border-r border-gray-100 p-6 flex flex-col gap-6 overflow-y-auto max-h-[calc(100vh-3rem)]">
              
              {/* 系统状态区 */}
              <div className="grid grid-cols-3 gap-2 bg-gray-50 rounded-xl p-3">
                <div className="text-center">
                  <div className="text-lg font-bold text-blue-600">{systemStatus.freq}</div>
                  <div className="text-xs text-gray-500 mt-1">当前频率</div>
                </div>
                <div className="text-center border-x border-gray-200">
                  <div className="text-lg font-bold text-blue-600">{systemStatus.note}</div>
                  <div className="text-xs text-gray-500 mt-1">当前音符</div>
                </div>
                <div className="text-center">
                  <div className="text-lg font-bold text-blue-600">{systemStatus.volume}</div>
                  <div className="text-xs text-gray-500 mt-1">音量强度</div>
                </div>
              </div>

              {/* 系统控制区 */}
              <div>
                <h3 className="text-sm font-bold text-gray-700 mb-3 flex items-center">
                  <span className="mr-2">🎛️</span> 系统控制
                </h3>
                
                {errorMsg && (
                  <div className="mb-3 bg-red-100 border border-red-200 text-red-700 px-3 py-2 rounded-lg text-xs flex items-center fade-in">
                    <Icons.Alert /> {errorMsg}
                  </div>
                )}

                <div className="grid grid-cols-2 gap-2">
                  <button 
                    onClick={startRecording} 
                    disabled={isRecording}
                    className={`py-2.5 rounded-lg text-sm font-medium flex items-center justify-center transition-colors ${isRecording ? 'bg-gray-100 text-gray-400' : 'bg-green-500 text-white hover:bg-green-600'}`}
                  >
                    <Icons.Mic /> <span className="ml-1.5">开始录音</span>
                  </button>
                  <button 
                    onClick={stopRecording} 
                    disabled={!isRecording}
                    className={`py-2.5 rounded-lg text-sm font-medium flex items-center justify-center transition-colors ${!isRecording ? 'bg-gray-100 text-gray-400' : 'bg-red-500 text-white hover:bg-red-600'}`}
                  >
                    <Icons.Stop /> <span className="ml-1.5">停止录音</span>
                  </button>
                  <button 
                    onClick={getScore} 
                    disabled={scoreLoading}
                    className="col-span-2 py-2.5 rounded-lg text-sm font-medium bg-blue-500 text-white hover:bg-blue-600 flex items-center justify-center transition-colors disabled:bg-blue-300"
                  >
                    <Icons.Star /> <span className="ml-1.5">{scoreLoading ? 'AI评分中...' : '获取评分'}</span>
                  </button>
                  <button 
                    onClick={testMic}
                    className="col-span-2 py-2.5 rounded-lg text-sm font-medium bg-gray-100 text-gray-700 hover:bg-gray-200 flex items-center justify-center transition-colors"
                  >
                    <Icons.Mic /> <span className="ml-1.5">测试麦克风</span>
                  </button>
                </div>
              </div>

              {/* 伴奏设置区 */}
              <div>
                <h3 className="text-sm font-bold text-gray-700 mb-3 flex items-center">
                  <span className="mr-2">🎵</span> 伴奏设置
                </h3>
                <div className="space-y-2">
                  <label className="flex items-center justify-center w-full py-2.5 bg-emerald-50 text-emerald-700 rounded-lg cursor-pointer hover:bg-emerald-100 transition-colors text-sm font-medium">
                    <Icons.Upload /> <span className="ml-1.5">上传本地伴奏</span>
                    <input type="file" accept="audio/*" className="hidden" onChange={handleAccUpload} />
                  </label>
                  <div className="flex space-x-2">
                    <button 
                      onClick={toggleAccPlay} 
                      disabled={!accompanimentUrl}
                      className={`flex-1 py-2.5 rounded-lg text-sm font-medium flex items-center justify-center transition-colors ${!accompanimentUrl ? 'bg-gray-100 text-gray-400' : 'bg-blue-100 text-blue-700 hover:bg-blue-200'}`}
                    >
                      <Icons.Play /> <span className="ml-1.5">{isPlayingAcc ? '暂停' : '播放'}</span>
                    </button>
                    <button 
                      onClick={stopAcc} 
                      disabled={!accompanimentUrl}
                      className={`flex-1 py-2.5 rounded-lg text-sm font-medium flex items-center justify-center transition-colors ${!accompanimentUrl ? 'bg-gray-100 text-gray-400' : 'bg-red-100 text-red-700 hover:bg-red-200'}`}
                    >
                      <Icons.Stop /> <span className="ml-1.5">停止</span>
                    </button>
                  </div>
                  <div className="flex items-center space-x-3 pt-2">
                    <Icons.Volume />
                    <input 
                      type="range" min="0" max="1" step="0.01" 
                      value={volume} onChange={handleVolumeChange}
                      className="flex-1"
                      disabled={!accompanimentUrl}
                    />
                  </div>
                </div>
              </div>

              {/* 麦克风设置区 */}
              <div>
                <h3 className="text-sm font-bold text-gray-700 mb-3 flex items-center">
                  <span className="mr-2">🎤</span> 麦克风设置
                </h3>
                <select 
                  value={selectedMic} 
                  onChange={(e) => setSelectedMic(e.target.value)}
                  className="w-full p-2.5 bg-gray-50 border border-gray-200 rounded-lg text-sm text-gray-700 focus:outline-none focus:ring-2 focus:ring-blue-500"
                >
                  <option value="">自动选择麦克风</option>
                  {micDevices.map(device => (
                    <option key={device.deviceId} value={device.deviceId}>
                      {device.label || `麦克风 ${device.deviceId.slice(0, 5)}`}
                    </option>
                  ))}
                </select>
              </div>

            </div>

            {/* ================= 右侧显示面板 (2/3) ================= */}
            <div className="w-full md:w-2/3 p-6 flex flex-col gap-6 bg-gray-50/50 overflow-y-auto max-h-[calc(100vh-3rem)]">
              
              {/* 顶部水平同排区域 */}
              <div className="flex flex-col md:flex-row gap-6 h-1/2 min-h-[300px]">
                
                {/* 左半部分：曲谱上传与预览区 */}
                <div className="w-full md:w-1/2 bg-white rounded-xl shadow-sm border border-gray-100 p-4 flex flex-col">
                  <h3 className="text-sm font-bold text-gray-700 mb-3 flex items-center">
                    <span className="mr-2">🖼️</span> 曲谱预览
                  </h3>
                  <div className="flex-1 border-2 border-dashed border-gray-200 rounded-lg flex items-center justify-center relative overflow-hidden hover:border-blue-400 transition-colors group">
                    {scoreImage ? (
                      <img src={scoreImage} alt="曲谱" className="w-full h-full object-contain" />
                    ) : (
                      <label className="flex flex-col items-center justify-center cursor-pointer w-full h-full text-gray-400 group-hover:text-blue-500">
                        <Icons.Image />
                        <span className="text-xs mt-2">点击或拖拽上传曲谱照片</span>
                        <span className="text-[10px] text-gray-300 mt-1">支持 JPG, PNG</span>
                        <input type="file" accept="image/*" className="hidden" onChange={handleScoreImageUpload} />
                      </label>
                    )}
                  </div>
                </div>

                {/* 右半部分：实时音高曲线监控区 */}
                <div className="w-full md:w-1/2">
                  <PitchChart isRecording={isRecording} />
                </div>

              </div>

              {/* 底部：AI评分结果区 */}
              <div className="flex-1 bg-gradient-to-br from-emerald-400 to-teal-500 rounded-2xl shadow-lg p-6 text-white flex flex-col relative overflow-hidden">
                {/* 背景装饰 */}
                <div className="absolute top-0 right-0 w-64 h-64 bg-white/10 rounded-full -mr-20 -mt-20 blur-2xl"></div>
                <div className="absolute bottom-0 left-0 w-48 h-48 bg-black/5 rounded-full -ml-10 -mb-10 blur-xl"></div>

                <div className="flex items-center justify-center mb-4 relative z-10">
                  <Icons.Trophy />
                  <h2 className="text-lg font-bold ml-2 tracking-wide">AI评分结果</h2>
                </div>

                <div className="text-center mb-6 relative z-10">
                  {scoreLoading ? (
                    <div className="flex flex-col items-center justify-center h-24 space-y-3">
                      <div className="w-8 h-8 border-4 border-white/30 border-t-white rounded-full animate-spin"></div>
                      <p className="text-emerald-50 text-sm animate-pulse">正在分析您的演唱...</p>
                    </div>
                  ) : (
                    <>
                      <div className="text-6xl font-black tracking-tighter mb-2 drop-shadow-md">
                        {scoreResult.total}
                      </div>
                      <p className="text-emerald-50 text-sm">
                        录音完成，时长：{scoreResult.duration}秒，检测到 {scoreResult.pitchCount} 个音高点
                      </p>
                    </>
                  )}
                </div>

                <div className="mt-auto grid grid-cols-3 gap-4 relative z-10 bg-white/15 backdrop-blur-sm rounded-xl p-4">
                  <div className="text-center">
                    <div className="text-xs text-emerald-50 mb-1">音准</div>
                    <div className="text-xl font-bold">{scoreResult.dimensions.pitch}</div>
                  </div>
                  <div className="text-center border-x border-white/20">
                    <div className="text-xs text-emerald-50 mb-1">节奏</div>
                    <div className="text-xl font-bold">{scoreResult.dimensions.rhythm}</div>
                  </div>
                  <div className="text-center">
                    <div className="text-xs text-emerald-50 mb-1">稳定性</div>
                    <div className="text-xl font-bold">{scoreResult.dimensions.stability}</div>
                  </div>
                </div>
              </div>

            </div>

          </div>
          
          {/* 隐藏的 Audio 标签用于播放伴奏 */}
          <audio 
            ref={audioRef} 
            src={accompanimentUrl} 
            onEnded={() => setIsPlayingAcc(false)}
          />
        </div>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
